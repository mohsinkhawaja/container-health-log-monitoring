name: qa-health-lab
services:
  demo:
    build: .
    ports:
      - "127.0.0.1:${DEMO_PORT:-8080}:8080"
    environment:
      DEMO_EMIT_ERROR: "${DEMO_EMIT_ERROR:-0}"
    healthcheck:
      test: ["CMD", "python", "-c", "from urllib.request import urlopen; assert urlopen('http://localhost:8080/health', timeout=2).status == 200"]
      interval: 2s
      timeout: 3s
      start_period: 3s
      retries: 10
